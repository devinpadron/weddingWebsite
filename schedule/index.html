<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule · Samantha &amp; Devin</title>
<meta name="description" content="The four-day weekend, hour by hour — 1–4 June 2027, Umbria.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.samanthaanddevin.com/schedule/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<!-- Passcode gate: hide the page before paint if already unlocked (no flash). -->
<link rel="stylesheet" href="../gate.css">
<script>
  try {
    if (localStorage.getItem('wedding_invited_v1') === '1') {
      document.documentElement.classList.add('gate-unlocked');
    }
  } catch (e) {}
</script>
<link rel="stylesheet" href="../site.css">

<!-- Site-wide tweak defaults (keep in sync with the homepage) -->
<script>
  window.__TWEAKS__ = {
    "palette": "parchment",
    "monogram": "S & D",
    "showWatermark": true,
    "italicAccents": true
  };
</script>
</head>
<body>

<!-- Gate (shared with homepage) -->
<div id="passcode-gate">
  <span class="lock-eyebrow">A private invitation</span>
  <div class="lock-rule"></div>
  <div class="text-input-wrap">
    <div class="field-group">
      <input class="name-input" id="name-input" type="text" placeholder="Your name" autocomplete="name" spellcheck="false" maxlength="80"/>
    </div>
    <div class="field-group">
      <p class="lock-prompt">Enter password</p>
      <input class="pw-input" type="password" placeholder="password" autocomplete="off" spellcheck="false"/>
    </div>
    <button class="pw-submit">Enter</button>
  </div>
  <p class="error-msg invisible">Try again</p>
</div>

<div id="page-content">
<div id="root"></div>
</div>

<script src="../gate.js" defer></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../sections.jsx"></script>
<script type="text/babel" src="../sections2.jsx"></script>
<script type="text/babel" src="../page.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(
    <WeddingPage solidNav={true}>
      <ScheduleSection />
    </WeddingPage>
  );
</script>

</body>
</html>
