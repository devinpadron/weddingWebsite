<style>

    --parchment: #F5F0E8;

  }
  h1 {
    font-family: 'Cormorant Garamond', serif; font-weight: 300;
    font-size: clamp(32px, 5vw, 52px); margin: 0; line-height: 1.15;
  }
  h1 em { font-style: italic; }
  p { color: var(--umber); font-size: 15px; margin: 0; }
  a.home {
    font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
    font-weight: 400; color: var(--espresso); text-decoration: none;
    border-bottom: 0.5px solid var(--travertine); padding-bottom: 6px;
    margin-top: 12px;
  }
